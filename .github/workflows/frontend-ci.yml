name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test, lint, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ci-backend-disabled.invalid
      VITE_SUPABASE_ANON_KEY: ci-backend-disabled
      VITE_PAID_PLANS_ENABLED: "false"
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and regression tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public route and accessibility smoke tests
        run: npm run test:e2e

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Audit development toolchain
        run: npm run audit:ci

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflab-playwright-${{ github.run_id }}
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          if-no-files-found: warn
          retention-days: 14
